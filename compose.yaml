name: task-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  static-init:
    build: .
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R app:app /app/staticfiles /app/media"]
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    restart: "no"

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
      static-init:
        condition: service_completed_successfully
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./backup_status:/app/backup_status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  notifier:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "0"
    command: ["sh", "-c", "while true; do python manage.py generate_due_notifications; sleep 3600; done"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - static_data:/static:ro
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
  media_data:
