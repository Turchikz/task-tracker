{# Compact lamp and pull-cord theme switch, accessible by click, drag or keyboard. #}
<button
  type="button"
  class="theme-bulb-toggle"
  data-theme-toggle
  aria-label="Включить тёмную тему"
  aria-pressed="false"
  title="Нажмите на лампочку или потяните шнур"
>
  <span class="theme-bulb-scene" aria-hidden="true">
    <span class="theme-bulb-wire"></span>
    <span class="theme-bulb-halo"></span>
    <svg class="theme-bulb-art" viewBox="0 0 48 48" focusable="false">
      <path class="theme-bulb-glass" d="M24 4.5c-9 0-15 6.6-15 15.2 0 5.6 3.1 9 6.3 12.3 1.5 1.5 1.8 3 1.9 4.2h13.6c.1-1.2.4-2.7 1.9-4.2 3.2-3.3 6.3-6.7 6.3-12.3C39 11.1 33 4.5 24 4.5Z"/>
      <path class="theme-bulb-filament" d="m19 26 3 4h4l3-4m-10-3 4 3 4-3"/>
      <path class="theme-bulb-sheen" d="M15.3 18a9.2 9.2 0 0 1 5-7"/>
      <rect class="theme-bulb-base" x="17" y="35.2" width="14" height="5.2" rx="1.6"/>
      <path class="theme-bulb-thread" d="M18 37.1h12M19.5 40.5h9M21 43h6"/>
    </svg>
    <span class="theme-bulb-pull">
      <span class="theme-bulb-cord"></span>
      <span class="theme-bulb-grip"></span>
    </span>
  </span>
</button>
