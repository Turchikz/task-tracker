{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<h1>{{ title }}</h1><form method="post" class="form-card">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="actions"><button class="btn primary" type="submit">Сохранить</button><a class="btn secondary" href="{% url 'template_list' %}">Отмена</a></div></form>{% endblock %}
